<!DOCTYPE html>
<html lang="el">

<meta name="robots" content="noindex">
<meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Commissioner:wght@500;600;700&family=Noto+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
/* Layout: one working column; clinician screens are tables and forms, patient screens are large-tap questionnaires. */
*{box-sizing:border-box}
:root{
  --bg:#F3F5F7; --surface:#FFFFFF; --sunk:#E8ECF0; --fg:#17212B; --muted:#5A6672; --line:#D5DCE3;

  --good:#2D7A57; --warn:#9E6A12; --bad:#B03A3A; --good-soft:#DDEFE6; --warn-soft:#F6EAD4; --bad-soft:#F5DEDE;
  --f-display:"Commissioner","Noto Sans",system-ui,sans-serif;
  --f-body:"Noto Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;
  --r:10px; color-scheme:light;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0F151B; --surface:#17202A; --sunk:#1E2934; --fg:#E4EAF0; --muted:#98A5B2; --line:#2B3845;
  --accent:#86ABD6; --accent-ink:#0F151B; --accent-soft:#22344A;
  --good:#6CC59A; --warn:#E0AE5A; --bad:#E58383; --good-soft:#163428; --warn-soft:#3A2D16; --bad-soft:#3D1F1F; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0F151B; --surface:#17202A; --sunk:#1E2934; --fg:#E4EAF0; --muted:#98A5B2; --line:#2B3845;
  --accent:#86ABD6; --accent-ink:#0F151B; --accent-soft:#22344A;
  --good:#6CC59A; --warn:#E0AE5A; --bad:#E58383; --good-soft:#163428; --warn-soft:#3A2D16; --bad-soft:#3D1F1F; color-scheme:dark}
html,body{background:var(--bg);color:var(--fg);margin:0}
body{font-family:var(--f-body);font-size:15px;line-height:1.5;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 48px}
.wrap{max-width:960px;margin:0 auto}
header.top{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;padding-block:18px 14px;border-bottom:1px solid var(--line);margin-bottom:22px}
.brand{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}.brand b{font-family:var(--f-display);font-weight:700;font-size:20px}.brand span{color:var(--muted);font-size:13px}
nav.tabs{display:flex;gap:6px;flex-wrap:wrap}
h1,h2,h3{font-family:var(--f-display);text-wrap:balance;margin:0}h1{font-size:26px;font-weight:700}h2{font-size:19px;font-weight:600}h3{font-size:15px;font-weight:600}
p{margin:0}
.stack{display:flex;flex-direction:column;gap:16px}.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.muted{color:var(--muted)}.small{font-size:13.5px}
.eyebrow{font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:600}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:20px;min-width:0}
.btn{font:inherit;font-weight:600;border:1px solid var(--line);background:var(--surface);color:var(--fg);padding:10px 16px;border-radius:8px;cursor:pointer;min-height:42px;text-decoration:none;display:inline-flex;align-items:center}
.btn:hover{border-color:var(--accent)}.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.danger{color:var(--bad);border-color:var(--bad)}.btn.ghost{background:transparent;border-color:transparent;color:var(--muted)}.btn.ghost:hover{color:var(--fg);border-color:var(--line)}

.filebtn{position:relative;overflow:hidden}.filebtn input{position:absolute;inset:0;opacity:0;cursor:pointer}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
label.f{display:flex;flex-direction:column;gap:6px;font-weight:600;font-size:14px;min-width:0}
input[type=text],input[type=number],select,textarea{font:inherit;font-weight:400;padding:9px 11px;border:1px solid var(--line);border-radius:8px;background:var(--surface);color:var(--fg);min-height:40px;width:100%}
textarea{min-height:70px;resize:vertical}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:14px}
.grid3{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:14px}
.checks{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:4px 14px}
.checks label,.radios label{display:flex;gap:8px;align-items:flex-start;font-weight:400;font-size:14px;padding:4px 0}
.checks input,.radios input{margin-top:3px;width:18px;height:18px;flex:none}
.radios{display:flex;flex-direction:column;gap:2px}
fieldset{border:0;margin:0;padding:0;min-width:0}legend{padding:0}
.warnbox{background:var(--warn-soft);border-radius:8px;padding:12px 14px;font-size:14px}.errbox{background:var(--bad-soft);border-radius:8px;padding:12px 14px;font-size:14px}.okbox{background:var(--good-soft);border-radius:8px;padding:12px 14px;font-size:14px}
.code{font-family:var(--f-mono);font-weight:700;letter-spacing:.1em}
ul.plain{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.chip{display:inline-block;font-size:12px;font-weight:600;padding:2px 8px;border-radius:999px;background:var(--sunk);color:var(--muted);white-space:nowrap}
.chip.ok{background:var(--good-soft);color:var(--good)}.chip.warn{background:var(--warn-soft);color:var(--warn)}.chip.bad{background:var(--bad-soft);color:var(--bad)}
.qhead{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;align-items:flex-end}
.progress{height:6px;background:var(--sunk);border-radius:3px;overflow:hidden}.progress i{display:block;height:100%;background:var(--accent);transition:width .2s}
.items{display:flex;flex-direction:column;gap:12px}
.item{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px 18px;display:flex;flex-direction:column;gap:12px}
.item.miss{border-color:var(--warn)}.item .q{font-size:17px;line-height:1.45;float:left;width:100%;padding:0}.item .q+*{clear:both}
.opts{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.opts.o3{grid-template-columns:repeat(3,1fr)}
.opt{font:inherit;font-size:14.5px;padding:10px 6px;border-radius:8px;border:1px solid var(--line);background:var(--bg);color:var(--fg);cursor:pointer;min-height:52px}
.opt[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.pager{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;align-items:center}
.tablewrap{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r);background:var(--surface)}
table{border-collapse:collapse;width:100%;font-size:14px}
th,td{text-align:left;padding:9px 11px;border-bottom:1px solid var(--line);white-space:nowrap;font-variant-numeric:tabular-nums;vertical-align:middle}
th{font-size:12px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);font-weight:600;background:var(--sunk)}
tr:last-child td{border-bottom:0}tbody tr.click{cursor:pointer}tbody tr.click:hover td{background:var(--sunk)}
tr.grp td{background:var(--sunk);font-weight:600;font-size:12.5px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted)}
tr.sum td{font-weight:600;background:var(--sunk)}
.hot{color:var(--bad);font-weight:700}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.seg button{font:inherit;font-size:13px;border:0;background:var(--surface);color:var(--fg);padding:7px 10px;cursor:pointer}
.seg button+button{border-left:1px solid var(--line)}
.seg button[aria-pressed="true"][data-v="1"]{background:var(--bad-soft);color:var(--bad);font-weight:700}
.seg button[aria-pressed="true"][data-v="0"]{background:var(--sunk);color:var(--fg);font-weight:700}
input.ex{min-width:180px;min-height:34px;padding:6px 9px;font-size:13px}
.crit,.pq{display:flex;flex-direction:column;gap:6px;padding-top:12px;border-top:1px solid var(--line)}
.algo{display:flex;flex-wrap:wrap;gap:8px 16px;font-weight:600;font-size:14px}
.tally{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:8px}
.tally div{display:flex;justify-content:space-between;background:var(--sunk);border-radius:8px;padding:8px 12px}
.tally b{font-variant-numeric:tabular-nums}
.hold{position:relative;overflow:hidden}.hold .fill{position:absolute;inset:0;width:0;background:var(--accent-soft)}.hold span{position:relative}
.hold.on .fill{width:100%;transition:width 1.4s linear}
@media (max-width:560px){.opts{grid-template-columns:repeat(2,1fr)}.opts.o3{grid-template-columns:repeat(3,1fr)}h1{font-size:22px}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
@media print{
  body{background:#fff;color:#000;padding:0;font-size:11.5pt}
  header.top,.noprint{display:none!important}
  .panel,.tablewrap{border-color:#bbb;break-inside:avoid}
  .report section{break-inside:auto}
  th{background:#eee!important;color:#000}
  .chip{border:1px solid #999;background:#fff!important;color:#000!important}
  .wrap{max-width:none}
}

.wrap{max-width:640px;padding-block:24px 48px}
</style>
</head>

const SETTINGS=['Εργασία / σπουδές','Σπίτι / οικογένεια','Σχέσεις / φίλοι','Οικονομικά / διοικητικά','Οδήγηση / ασφάλεια'];
const BSRC=['Αναφορά γονέων','Σχολικοί έλεγχοι / βαθμολογίες','Αδέλφια ή συγγενείς','Μόνο αυτοαναφορά'];
const FINAL=['—','ΔΕΠΥ, συνδυασμένη παρουσίαση (ICD-11 6A05.2 · DSM-5-TR F90.2)','ΔΕΠΥ, κυρίως απρόσεκτη παρουσίαση (ICD-11 6A05.0 · DSM-5-TR F90.0)','ΔΕΠΥ, κυρίως υπερκινητική-παρορμητική παρουσίαση (ICD-11 6A05.1 · DSM-5-TR F90.1)','Άλλη καθορισμένη ΔΕΠΥ (ICD-11 6A05.Y · DSM-5-TR F90.8)','Δεν πληρούνται τα κριτήρια ΔΕΠΥ','Εκκρεμεί: χρειάζεται περαιτέρω αξιολόγηση'];
const ASDFINAL=['—','Δεν υπάρχει ΔΑΦ','Συννοσηρή ΔΑΦ (ICD-11 6A02)','Η ΔΑΦ εξηγεί καλύτερα τα συμπτώματα','Παραπομπή για αξιολόγηση ΔΑΦ (ADOS-2 / ADI-R)'];
const SEV=['—','Ήπια','Μέτρια','Σοβαρή'];
const SEX=['Άνδρας','Γυναίκα','Άλλο','Δεν απαντώ'];
const EDU=['Δημοτικό (ή λιγότερο)','Γυμνάσιο','Λύκειο','ΙΕΚ / μεταδευτεροβάθμια','ΑΕΙ (πτυχίο)','Μεταπτυχιακό','Διδακτορικό'];
const OCC=['Φοιτητής/τρια','Εργαζόμενος/η','Άνεργος/η','Συνταξιούχος','Οικιακά','Άλλο'];
const PRIOR=[['none','Καμία'],['adhd','ΔΕΠΥ'],['asd','ΔΑΦ'],['ld','Μαθησιακές δυσκολίες'],['dep','Κατάθλιψη'],['anx','Αγχώδης διαταραχή'],['bip','Διπολική διαταραχή'],['bpd','Διαταραχή προσωπικότητας'],['epi','Επιληψία'],['sub','Χρήση ουσιών'],['other','Άλλη']];
const REL=['Γονέας','Σύζυγος / σύντροφος','Αδελφός/ή','Παιδί','Φίλος/η','Άλλο'];

/* ================= ΣΑΔΕ – φόρμα γονέα (Google Apps Script) ================= */
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const normCode=s=>String(s||'').toUpperCase().replace(/[^A-Z0-9]/g,'');
const store={get(k){try{return JSON.parse(localStorage.getItem(k))}catch{return null}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch{}},del(k){try{localStorage.removeItem(k)}catch{}}};
const app=document.getElementById('app');
const D={view:'intro',code:normCode(typeof CODE==='string'?CODE:''),relation:'',sex:'',knewChild:null,IN:{},IC:{},pages:[],pg:0,err:'',miss:false,startedAt:new Date().toISOString()};
const draftKey=()=>'sade_parent_'+D.code;
(function restore(){const d=D.code&&store.get(draftKey());if(d)Object.assign(D,d,{view:'intro',err:''})})();
function saveDraft(){if(D.code)store.set(draftKey(),{relation:D.relation,sex:D.sex,knewChild:D.knewChild,IN:D.IN,IC:D.IC,startedAt:D.startedAt})}
function buildPages(){const out=[];const add=(m,store)=>MODS[m].sec.forEach(sec=>{for(let i=0;i<sec.items.length;i+=6)out.push({m,store,t:MODS[m].title+' · '+sec.t,intro:i===0&&sec===MODS[m].sec[0]?MODS[m].intro:'',sc:sec.sc,items:sec.items.slice(i,i+6)})});add('IN','IN');if(D.knewChild===1)add('IC','IC');D.pages=out}
function opt(list,val){return `<option value="">— Επιλέξτε —</option>`+list.map(x=>`<option ${x===val?'selected':''}>${esc(x)}</option>`).join('')}
function render(){window.scrollTo({top:0});({intro:vIntro,meta:vMeta,q:vQ,sending:vSending,thanks:vThanks})[D.view]()}
function vIntro(){
  app.innerHTML=`<div class="stack">
  <h1>Ερωτηματολόγιο για γονείς</h1>
  <p>Σας ευχαριστούμε που βοηθάτε στην αξιολόγηση. Οι ερωτήσεις αφορούν τη συμπεριφορά του ατόμου που αξιολογείται, σήμερα και όταν ήταν παιδί. Η συμπλήρωση διαρκεί περίπου <b>10 λεπτά</b>.</p>
  <div class="panel small stack"><p>Δεν ζητάμε ονόματα. Οι απαντήσεις συνδέονται μόνο με τον κωδικό που σας έδωσε ο θεραπευτής και φτάνουν μόνο στο ιατρείο. Μπορείτε να σταματήσετε όποτε θέλετε.</p></div>
  <label class="f" for="p_code">Κωδικός<input id="p_code" type="text" class="code" maxlength="8" autocapitalize="characters" autocomplete="off" value="${esc(D.code)}"></label>
  <label class="checks" style="display:flex" for="p_ok"><input type="checkbox" id="p_ok"> <span>Συμφωνώ να συμπληρώσω το ερωτηματολόγιο και να σταλούν οι απαντήσεις μου στο ιατρείο.</span></label>
  ${D.err?`<div class="errbox">${esc(D.err)}</div>`:''}
  <div><button class="btn primary" id="go">Έναρξη</button></div></div>`;
  document.getElementById('go').onclick=()=>{const c=normCode(document.getElementById('p_code').value);if(c.length<6){D.err='Γράψτε τον κωδικό των 6 χαρακτήρων που σας έστειλε ο θεραπευτής.';return render()}
    if(!document.getElementById('p_ok').checked){D.err='Για να συνεχίσετε, τσεκάρετε ότι συμφωνείτε.';return render()}
    if(c!==D.code){D.code=c;const d=store.get(draftKey());if(d)Object.assign(D,d)}D.err='';D.view='meta';render()};
}
function vMeta(){
  app.innerHTML=`<div class="stack"><span class="eyebrow">Κωδικός <span class="code">${esc(D.code)}</span></span><h1>Λίγα στοιχεία για εσάς</h1>
  <label class="f" for="p_rel">Ποια είναι η σχέση σας με το άτομο που αξιολογείται;<select id="p_rel">${opt(REL,D.relation)}</select></label>
  <label class="f" for="p_sex">Φύλο σας<select id="p_sex">${opt(SEX,D.sex)}</select></label>
  <label class="f" for="p_kc">Γνωρίζατε το άτομο όταν ήταν 5–12 ετών;<select id="p_kc"><option value="">— Επιλέξτε —</option><option value="1" ${D.knewChild===1?'selected':''}>Ναι</option><option value="0" ${D.knewChild===0?'selected':''}>Όχι</option></select></label>
  ${D.err?`<div class="errbox">${esc(D.err)}</div>`:''}
  <div class="pager"><button class="btn" id="back">Πίσω</button><button class="btn primary" id="go">Συνέχεια</button></div></div>`;
  document.getElementById('back').onclick=()=>{D.view='intro';D.err='';render()};
  document.getElementById('go').onclick=()=>{D.relation=document.getElementById('p_rel').value;D.sex=document.getElementById('p_sex').value;const kc=document.getElementById('p_kc').value;
    if(!D.relation||kc===''){D.err='Απαντήστε στη σχέση σας και στο αν γνωρίζατε το άτομο ως παιδί.';return render()}
    D.knewChild=+kc;if(D.knewChild===0)D.IC={};D.err='';buildPages();D.pg=0;D.view='q';saveDraft();render()};
}
function vQ(){
  const p=D.pages[D.pg],a=D[p.store],opts=SCALES[p.sc];
  const tot=D.pages.reduce((n,x)=>n+x.items.length,0),done=D.pages.reduce((n,x)=>n+x.items.filter(([k])=>D[x.store][k]!=null).length,0);
  app.innerHTML=`<div class="stack"><span class="eyebrow">Σελίδα ${D.pg+1} από ${D.pages.length}</span><div class="progress"><i style="width:${done/tot*100}%"></i></div>
  <h2>${esc(p.t)}</h2>${p.intro?`<div class="panel small">${p.intro}</div>`:''}
  <div class="items">${p.items.map(([k,t])=>`<fieldset class="item ${D.miss&&a[k]==null?'miss':''}" id="it_${k}"><legend class="q">${esc(t)}</legend><div class="opts">${opts.map(([l,v])=>`<button type="button" class="opt" data-k="${k}" data-v="${v}" aria-pressed="${a[k]===v}">${esc(l)}</button>`).join('')}</div></fieldset>`).join('')}</div>
  ${D.err?`<div class="errbox">${esc(D.err)}</div>`:''}
  <div class="pager"><button class="btn" id="back">Πίσω</button><button class="btn primary" id="go">${D.pg<D.pages.length-1?'Επόμενη σελίδα':'Αποστολή απαντήσεων'}</button></div></div>`;
  app.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{a[b.dataset.k]=+b.dataset.v;b.parentElement.querySelectorAll('.opt').forEach(x=>x.setAttribute('aria-pressed',String(x===b)));document.getElementById('it_'+b.dataset.k).classList.remove('miss');saveDraft()});
  document.getElementById('back').onclick=()=>{D.err='';if(D.pg===0)D.view='meta';else D.pg--;render()};
  document.getElementById('go').onclick=()=>{const miss=p.items.filter(([k])=>a[k]==null);if(miss.length){D.miss=true;D.err=`Απαντήστε σε όλες τις ερωτήσεις (λείπουν ${miss.length}).`;render();document.getElementById('it_'+miss[0][0]).scrollIntoView({block:'center'});return}
    D.miss=false;D.err='';if(D.pg<D.pages.length-1){D.pg++;render()}else submit()};
}
function vSending(){app.innerHTML='<div class="stack"><h1>Αποστολή…</h1><p class="muted">Μην κλείσετε τη σελίδα.</p></div>'}
function vThanks(){app.innerHTML='<div class="stack"><div class="okbox">Οι απαντήσεις σας στάλθηκαν στο ιατρείο.</div><h1>Ευχαριστούμε πολύ!</h1><p>Μπορείτε να κλείσετε αυτή τη σελίδα.</p></div>'}
function submit(){
  D.view='sending';render();
  const payload={code:D.code,relation:D.relation,sex:D.sex,knewChild:D.knewChild,IN:D.IN,IC:D.knewChild===1?D.IC:{},startedAt:D.startedAt};
  const fail=m=>{D.view='q';D.err='Η αποστολή δεν έγινε ('+m+'). Οι απαντήσεις σας κρατήθηκαν· ελέγξτε τη σύνδεση στο διαδίκτυο και πατήστε ξανά «Αποστολή».';render()};
  fetch(EXEC,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(Object.assign({type:'informant'},payload))})
   .then(r=>r.json()).then(j=>{if(j&&j.ok){store.del(draftKey());D.view='thanks';render()}else fail((j&&j.error)||'σφάλμα διακομιστή')})
   .catch(()=>fail('σφάλμα σύνδεσης'));
}
render();

</script>
</body>
</html>
