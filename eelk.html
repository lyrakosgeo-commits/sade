<script type="text/plain" id="bank">

/* ---------- instrument definition ---------- */
const SCALES=[
 {k:'AN',gr:'ΑΝ',name:'Αναστολή',idx:'DSR'},
 {k:'EY',gr:'ΕΥ',name:'Γνωστική ευελιξία',idx:'DSR'},
 {k:'RS',gr:'ΡΣ',name:'Ρύθμιση συναισθήματος',idx:'DSR'},
 {k:'AP',gr:'ΑΠ',name:'Αυτοπαρακολούθηση',idx:'DSR'},
 {k:'EN',gr:'ΕΝ',name:'Έναρξη',idx:'DMO'},
 {k:'EM',gr:'ΕΜ',name:'Εργαζόμενη μνήμη',idx:'DMO'},
 {k:'SO',gr:'ΣΟ',name:'Σχεδιασμός και οργάνωση',idx:'DMO'},
 {k:'EE',gr:'ΕΕ',name:'Έλεγχος εργασίας',idx:'DMO'},
 {k:'OY',gr:'ΟΥ',name:'Οργάνωση χώρου και υλικών',idx:'DMO'},
 {k:'DX',gr:'ΔΧ',name:'Διαχείριση χρόνου',idx:'DMO'}];
const INDICES=[{k:'DSR',gr:'ΔΣΡ',name:'Δείκτης Συμπεριφορικής Ρύθμισης',n:24},{k:'DMO',gr:'ΔΜΟ',name:'Δείκτης Μεταγνωστικής Οργάνωσης',n:36},{k:'GEC',gr:'ΣΔΕΛ',name:'Συνολικός Δείκτης',n:60}];
const I=(a,p)=>({a,p});
const ITEMS={
AN1:I('Λέω κάτι χωρίς να το σκεφτώ και μετά το μετανιώνω.','Λέει κάτι χωρίς να το σκεφτεί και μετά το μετανιώνει.'),
AN2:I('Διακόπτω τους άλλους πριν τελειώσουν αυτό που λένε.','Διακόπτει τους άλλους πριν τελειώσουν αυτό που λένε.'),
AN3:I('Παίρνω αποφάσεις τη στιγμή (αγορές, υποσχέσεις) χωρίς να σκεφτώ τις συνέπειες.','Παίρνει αποφάσεις τη στιγμή (αγορές, υποσχέσεις) χωρίς να σκεφτεί τις συνέπειες.'),
AN4:I('Δυσκολεύομαι να σταματήσω κάτι ευχάριστο (κινητό, παιχνίδι) όταν πρέπει να κάνω κάτι άλλο.','Δυσκολεύεται να σταματήσει κάτι ευχάριστο (κινητό, παιχνίδι) όταν πρέπει να κάνει κάτι άλλο.'),
AN5:I('Μου είναι δύσκολο να περιμένω τη σειρά μου.','Του/της είναι δύσκολο να περιμένει τη σειρά του/της.'),
AN6:I('Θόρυβοι ή ειδοποιήσεις με τραβάνε αμέσως μακριά από αυτό που κάνω.','Θόρυβοι ή ειδοποιήσεις τον/την τραβάνε αμέσως μακριά από αυτό που κάνει.'),
EY1:I('Αναστατώνομαι όταν αλλάζει απρόσμενα το πρόγραμμά μου.','Αναστατώνεται όταν αλλάζει απρόσμενα το πρόγραμμά του/της.'),
EY2:I('Όταν ένας τρόπος δεν δουλεύει, συνεχίζω να τον δοκιμάζω αντί να αλλάξω τακτική.','Όταν ένας τρόπος δεν δουλεύει, συνεχίζει να τον δοκιμάζει αντί να αλλάξει τακτική.'),
EY3:I('Μου παίρνει πολύ χρόνο να προσαρμοστώ σε νέο περιβάλλον ή νέους ανθρώπους.','Του/της παίρνει πολύ χρόνο να προσαρμοστεί σε νέο περιβάλλον ή νέους ανθρώπους.'),
EY4:I('«Κολλάω» σε μια σκέψη ή ένα θέμα και δυσκολεύομαι να το αφήσω.','«Κολλάει» σε μια σκέψη ή ένα θέμα και δυσκολεύεται να το αφήσει.'),
EY5:I('Δυσκολεύομαι να περάσω από μια δραστηριότητα στην επόμενη.','Δυσκολεύεται να περάσει από μια δραστηριότητα στην επόμενη.'),
EY6:I('Μου είναι δύσκολο να δω ένα πρόβλημα από άλλη οπτική γωνία.','Του/της είναι δύσκολο να δει ένα πρόβλημα από άλλη οπτική γωνία.'),
RS1:I('Τα συναισθήματά μου ανεβαίνουν πολύ γρήγορα, πιο έντονα από όσο ταιριάζει στην περίσταση.','Τα συναισθήματά του/της ανεβαίνουν πολύ γρήγορα, πιο έντονα από όσο ταιριάζει στην περίσταση.'),
RS2:I('Όταν θυμώσω ή στενοχωρηθώ, αργώ πολύ να ηρεμήσω.','Όταν θυμώσει ή στενοχωρηθεί, αργεί πολύ να ηρεμήσει.'),
RS3:I('Η διάθεσή μου αλλάζει απότομα μέσα στη μέρα.','Η διάθεσή του/της αλλάζει απότομα μέσα στη μέρα.'),
RS4:I('Όταν είμαι αναστατωμένος/η, δεν μπορώ να συνεχίσω αυτό που έκανα.','Όταν είναι αναστατωμένος/η, δεν μπορεί να συνεχίσει αυτό που έκανε.'),
RS5:I('Μια αναποδιά το πρωί μου χαλάει όλη τη μέρα.','Μια αναποδιά το πρωί του/της χαλάει όλη τη μέρα.'),
RS6:I('Κλαίω ή φωνάζω σε στιγμές που αργότερα μου φαίνονται δυσανάλογες.','Κλαίει ή φωνάζει σε στιγμές που δεν το δικαιολογούν.'),
AP1:I('Καταλαβαίνω αργά ότι η συμπεριφορά μου ενόχλησε κάποιον.','Καταλαβαίνει αργά ότι η συμπεριφορά του/της ενόχλησε κάποιον.'),
AP2:I('Δεν προσέχω πώς αντιδρούν οι άλλοι όσο μιλάω.','Δεν προσέχει πώς αντιδρούν οι άλλοι όσο μιλάει.'),
AP3:I('Μιλάω πολλή ώρα για κάτι που με ενδιαφέρει, χωρίς να δω αν οι άλλοι έχουν βαρεθεί.','Μιλάει πολλή ώρα για κάτι που τον/την ενδιαφέρει, χωρίς να δει αν οι άλλοι έχουν βαρεθεί.'),
AP4:I('Εκπλήσσομαι όταν μου λένε πώς φάνηκα σε μια κατάσταση.','Εκπλήσσεται όταν του/της λένε πώς φάνηκε σε μια κατάσταση.'),
AP5:I('Δυσκολεύομαι να εκτιμήσω πόσο καλά πήγε κάτι που έκανα (π.χ. μια εξέταση).','Δυσκολεύεται να εκτιμήσει πόσο καλά πήγε κάτι που έκανε (π.χ. μια εξέταση).'),
AP6:I('Μιλάω με τον ίδιο τρόπο σε όλους, ακόμα και όταν θα έπρεπε να τον προσαρμόσω (καθηγητής, φίλος, γιατρός).','Μιλάει με τον ίδιο τρόπο σε όλους, ακόμα και όταν θα έπρεπε να τον προσαρμόσει.'),
EN1:I('Αναβάλλω να ξεκινήσω εργασίες, ακόμα και όταν ξέρω ότι πρέπει.','Αναβάλλει να ξεκινήσει εργασίες, ακόμα και όταν ξέρει ότι πρέπει.'),
EN2:I('Χρειάζομαι κάποιον να με σπρώξει για να αρχίσω κάτι.','Χρειάζεται κάποιον να τον/την σπρώξει για να αρχίσει κάτι.'),
EN3:I('Κάθομαι να διαβάσω (ή να δουλέψω), αλλά περνάει πολλή ώρα μέχρι να ξεκινήσω πραγματικά.','Κάθεται να διαβάσει (ή να δουλέψει), αλλά περνάει πολλή ώρα μέχρι να ξεκινήσει πραγματικά.'),
EN4:I('Όταν δεν έχω πρόγραμμα, δυσκολεύομαι να βρω μόνος/η μου τι να κάνω.','Όταν δεν έχει πρόγραμμα, δυσκολεύεται να βρει μόνος/η του/της τι να κάνει.'),
EN5:I('Έχω ιδέες ή σχέδια, αλλά δεν τα κάνω πράξη.','Έχει ιδέες ή σχέδια που λέει, αλλά δεν τα κάνει πράξη.'),
EN6:I('Σε ομαδικές δουλειές περιμένω να μου πουν τι να κάνω, δεν παίρνω πρωτοβουλία.','Σε ομαδικές δουλειές περιμένει να του/της πουν τι να κάνει, δεν παίρνει πρωτοβουλία.'),
EM1:I('Μπαίνω σε ένα δωμάτιο και ξεχνάω τι πήγα να κάνω.','Μπαίνει σε ένα δωμάτιο και ξεχνά τι πήγε να κάνει.'),
EM2:I('Όταν μου δίνουν πολλές οδηγίες μαζί, θυμάμαι μόνο τις πρώτες.','Όταν του/της δίνουν πολλές οδηγίες μαζί, θυμάται μόνο τις πρώτες.'),
EM3:I('Χάνω τον ειρμό μου στη μέση μιας συζήτησης.','Χάνει τον ειρμό του/της στη μέση μιας συζήτησης.'),
EM4:I('Δυσκολεύομαι να ακούω και να κρατάω σημειώσεις ταυτόχρονα.','Δυσκολεύεται να ακούει και να κρατά σημειώσεις ταυτόχρονα.'),
EM5:I('Αν δεν το γράψω, ξεχνάω κάτι που είχα υποσχεθεί να κάνω.','Αν δεν το γράψει, ξεχνά κάτι που είχε υποσχεθεί να κάνει.'),
EM6:I('Διαβάζω μια σελίδα και στο τέλος δεν θυμάμαι τι διάβασα.','Μετά από διάβασμα δεν μπορεί να πει τι διάβασε.'),
SO1:I('Δυσκολεύομαι να χωρίσω μια μεγάλη εργασία σε μικρότερα βήματα.','Δυσκολεύεται να χωρίσει μια μεγάλη εργασία σε μικρότερα βήματα.'),
SO2:I('Ξεκινάω χωρίς σχέδιο και στη μέση βλέπω ότι μου λείπουν πράγματα.','Ξεκινά χωρίς σχέδιο και στη μέση βλέπει ότι του/της λείπουν πράγματα.'),
SO3:I('Δυσκολεύομαι να αποφασίσω τι είναι πιο σημαντικό να γίνει πρώτο.','Δυσκολεύεται να αποφασίσει τι είναι πιο σημαντικό να γίνει πρώτο.'),
SO4:I('Όταν γράφω ή εξηγώ κάτι, οι ιδέες μου βγαίνουν χωρίς σειρά.','Όταν γράφει ή εξηγεί κάτι, οι ιδέες του/της βγαίνουν χωρίς σειρά.'),
SO5:I('Χάνομαι στις λεπτομέρειες και δεν βλέπω το συνολικό.','Χάνεται στις λεπτομέρειες και δεν βλέπει το συνολικό.'),
SO6:I('Δυσκολεύομαι να οργανώσω ένα πρόγραμμα διαβάσματος ή δουλειάς για πολλές μέρες.','Δυσκολεύεται να οργανώσει ένα πρόγραμμα διαβάσματος ή δουλειάς για πολλές μέρες.'),
EE1:I('Παραδίδω μια δουλειά χωρίς να την ξανακοιτάξω.','Παραδίδει μια δουλειά χωρίς να την ξανακοιτάξει.'),
EE2:I('Σε γραπτά ή εξετάσεις χάνω μονάδες επειδή διάβασα λάθος την εκφώνηση.','Σε γραπτά ή εξετάσεις χάνει μονάδες επειδή διάβασε λάθος την εκφώνηση.'),
EE3:I('Δεν ελέγχω αν πάω καλά όσο δουλεύω· το βλέπω μόνο στο τέλος.','Δεν ελέγχει αν πάει καλά όσο δουλεύει· το βλέπει μόνο στο τέλος.'),
EE4:I('Παραλείπω κάποιο υποερώτημα ή κομμάτι μιας εργασίας.','Παραλείπει κάποιο υποερώτημα ή κομμάτι μιας εργασίας.'),
EE5:I('Δεν καταλαβαίνω εγκαίρως ότι κάτι που κάνω έχει πάρει λάθος δρόμο.','Δεν καταλαβαίνει εγκαίρως ότι κάτι που κάνει έχει πάρει λάθος δρόμο.'),
EE6:I('Όταν βιάζομαι, η ποιότητα της δουλειάς μου πέφτει χωρίς να το αντιληφθώ.','Όταν βιάζεται, η ποιότητα της δουλειάς του/της πέφτει χωρίς να το αντιληφθεί.'),
OY1:I('Ψάχνω πράγματα που χρειάζομαι (κλειδιά, κινητό, σημειώσεις).','Ψάχνει πράγματα που χρειάζεται (κλειδιά, κινητό, σημειώσεις).'),
OY2:I('Το δωμάτιο ή το γραφείο μου είναι τόσο ακατάστατο που με δυσκολεύει να δουλέψω.','Το δωμάτιο ή το γραφείο του/της είναι τόσο ακατάστατο που τον/την δυσκολεύει να δουλέψει.'),
OY3:I('Χάνω σημαντικά χαρτιά ή αρχεία.','Χάνει σημαντικά χαρτιά ή αρχεία.'),
OY4:I('Ξεχνάω να πάρω μαζί μου κάτι που χρειάζομαι (φάρμακα, ταυτότητα, υλικό μαθήματος).','Ξεχνά να πάρει μαζί του/της κάτι που χρειάζεται (φάρμακα, ταυτότητα, υλικό μαθήματος).'),
OY5:I('Οι σημειώσεις μου είναι σκόρπιες και δεν τις βρίσκω όταν τις χρειάζομαι.','Οι σημειώσεις του/της είναι σκόρπιες και δεν τις βρίσκει όταν τις χρειάζεται.'),
OY6:I('Τα αρχεία στον υπολογιστή ή στο κινητό μου δεν έχουν κανένα σύστημα.','Τα αρχεία στον υπολογιστή ή στο κινητό του/της δεν έχουν κανένα σύστημα.'),
DX1:I('Υποτιμώ πόσο χρόνο θα μου πάρει κάτι.','Υποτιμά πόσο χρόνο θα του/της πάρει κάτι.'),
DX2:I('Αργώ σε ραντεβού, μαθήματα ή δουλειά.','Αργεί σε ραντεβού, μαθήματα ή δουλειά.'),
DX3:I('Χάνω προθεσμίες (εργασίες, δηλώσεις μαθημάτων, πληρωμές).','Χάνει προθεσμίες (εργασίες, δηλώσεις μαθημάτων, πληρωμές).'),
DX4:I('Αφήνω τα πάντα για την τελευταία στιγμή.','Αφήνει τα πάντα για την τελευταία στιγμή.'),
DX5:I('Όταν ασχολούμαι με κάτι, δεν καταλαβαίνω πόση ώρα έχει περάσει.','Όταν ασχολείται με κάτι, δεν καταλαβαίνει πόση ώρα έχει περάσει.'),
DX6:I('Δυσκολεύομαι να τηρήσω ένα εβδομαδιαίο πρόγραμμα που έχω φτιάξει.','Δυσκολεύεται να τηρήσει ένα εβδομαδιαίο πρόγραμμα που έχει φτιάξει.'),
EL1:I('Δεν θυμάμαι τη διεύθυνση του σπιτιού όπου μένω.','Δεν θυμάται τη διεύθυνση του σπιτιού όπου μένει.'),
EL2:I('Ξεχνάω πού άφησα κάποιο μικρό αντικείμενο.','Ξεχνά πού άφησε κάποιο μικρό αντικείμενο.'),
EL3:I('Χάνομαι στον δρόμο για το σπίτι μου.','Χάνεται στον δρόμο για το σπίτι του/της.'),
EL4:I('Θέλω λίγο χρόνο να σκεφτώ πριν απαντήσω σε μια δύσκολη ερώτηση.','Θέλει λίγο χρόνο να σκεφτεί πριν απαντήσει σε μια δύσκολη ερώτηση.')};
</script>
<script type="text/plain" id="fcode">
/* ================= ΕΕΛΚ-Ε – φόρμα με σύνδεσμο (Μορφή Α ή Π) ================= */
const KEYS=Object.keys(ITEMS);
const ORDER=(()=>{let s=20261110;const r=()=>{s|=0;s=s+0x6D2B79F5|0;let t=Math.imul(s^s>>>15,1|s);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296};const a=KEYS.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(r()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a})();
const OPTS=[[0,'Ποτέ'],[1,'Σπάνια'],[2,'Συχνά'],[3,'Πολύ συχνά']],PER=8;
const SEXL=['Άνδρας','Γυναίκα','Άλλο','Δεν απαντώ'],RELL=['Γονέας','Σύζυγος / σύντροφος','Αδελφός/ή','Παιδί','Φίλος/η','Άλλο'];
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const norm=s=>String(s||'').toUpperCase().replace(/[^A-Z0-9]/g,'');
const st={get(k){try{return JSON.parse(localStorage.getItem(k))}catch{return null}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch{}},del(k){try{localStorage.removeItem(k)}catch{}}};
const box=document.getElementById('app'),qs=new URLSearchParams(location.search);
const F=qs.get('f')==='P'?'P':'A',isA=F==='A';
const E={view:'intro',code:norm(qs.get('code')||''),ans:{},pg:0,inf:{relation:'',sex:'',hours:''},err:'',miss:false,startedAt:new Date().toISOString(),done:false};
const dk=()=>`eelk_link_${E.code}_${F}`;
function load(){const d=E.code&&st.get(dk());if(d)Object.assign(E,{ans:d.ans||{},pg:d.pg||0,inf:d.inf||E.inf,startedAt:d.startedAt||E.startedAt,done:!!d.done})}load();
const save=()=>{if(E.code)st.set(dk(),{ans:E.ans,pg:E.pg,inf:E.inf,startedAt:E.startedAt,done:E.done})};
const pages=Math.ceil(ORDER.length/PER);
function render(){window.scrollTo({top:0});({intro:vIntro,meta:vMeta,q:vQ,sending:()=>{box.innerHTML='<div class="stack"><h1>Αποστολή…</h1><p class="muted">Μην κλείσετε τη σελίδα.</p></div>'},thanks:vThanks})[E.view]()}
const opt=(l,v)=>`<option value="">— Επιλέξτε —</option>`+l.map(x=>`<option ${x===v?'selected':''}>${esc(x)}</option>`).join('');
function vIntro(){
  const resume=Object.keys(E.ans).length>0&&!E.done;
  box.innerHTML=`<div class="stack"><h1>${isA?'Ερωτηματολόγιο καθημερινής οργάνωσης':'Ερωτηματολόγιο για συνοδό'}</h1>
  <p>${isA?'Οι προτάσεις αφορούν την καθημερινή σας ζωή <b>τον τελευταίο μήνα</b>: οργάνωση, συγκέντρωση, συναισθήματα, προγραμματισμό. Δεν υπάρχουν σωστές ή λάθος απαντήσεις.':'Οι προτάσεις αφορούν την καθημερινή ζωή του ατόμου που αξιολογείται, όπως την έχετε παρατηρήσει <b>τον τελευταίο μήνα</b>.'} Η συμπλήρωση διαρκεί περίπου <b>10 λεπτά</b>.</p>
  <div class="panel small"><p>Δεν ζητάμε ονόματα. Οι απαντήσεις συνδέονται μόνο με τον κωδικό που σας έδωσε ο θεραπευτής και φτάνουν μόνο στο ιατρείο. Αν διακόψετε, συνεχίζετε ανοίγοντας ξανά τον ίδιο σύνδεσμο από την ίδια συσκευή.</p></div>
  <label class="f" for="c">Κωδικός<input id="c" type="text" class="code" maxlength="8" autocapitalize="characters" autocomplete="off" value="${esc(E.code)}"></label>
  <label class="checks" style="display:flex" for="ok"><input type="checkbox" id="ok"> <span>Συμφωνώ να συμπληρώσω το ερωτηματολόγιο και να σταλούν οι απαντήσεις μου στο ιατρείο.</span></label>
  ${E.err?`<div class="errbox">${esc(E.err)}</div>`:''}<div><button class="btn primary" id="go">${resume?'Συνέχεια από εκεί που σταματήσατε':'Έναρξη'}</button></div></div>`;
  document.getElementById('go').onclick=()=>{const c=norm(document.getElementById('c').value);
    if(c.length<6){E.err='Γράψτε τον κωδικό των 6 χαρακτήρων που σας έστειλε ο θεραπευτής.';return render()}
    if(!document.getElementById('ok').checked){E.err='Για να συνεχίσετε, τσεκάρετε ότι συμφωνείτε.';return render()}
    if(c!==E.code){E.code=c;E.ans={};E.pg=0;E.done=false;load()}
    E.err='';if(E.done){E.view='thanks';return render()}E.view=isA?'q':'meta';save();render()};
}
function vMeta(){
  box.innerHTML=`<div class="stack"><span class="eyebrow">Κωδικός <span class="code">${esc(E.code)}</span></span><h1>Λίγα στοιχεία για εσάς</h1>
  <label class="f" for="r">Σχέση με το άτομο που αξιολογείται<select id="r">${opt(RELL,E.inf.relation)}</select></label>
  <label class="f" for="s">Φύλο σας<select id="s">${opt(SEXL,E.inf.sex)}</select></label>
  <label class="f" for="h">Πόσες ώρες την εβδομάδα περνάτε μαζί, περίπου;<input id="h" type="number" min="0" max="168" inputmode="numeric" value="${esc(E.inf.hours)}"></label>
  ${E.err?`<div class="errbox">${esc(E.err)}</div>`:''}<div class="pager"><button class="btn" id="back">Πίσω</button><button class="btn primary" id="go">Συνέχεια</button></div></div>`;
  document.getElementById('back').onclick=()=>{E.view='intro';E.err='';render()};
  document.getElementById('go').onclick=()=>{E.inf={relation:document.getElementById('r').value,sex:document.getElementById('s').value,hours:document.getElementById('h').value};
    if(!E.inf.relation){E.err='Επιλέξτε τη σχέση σας με το άτομο που αξιολογείται.';return render()}E.err='';E.view='q';save();render()};
}
function vQ(){
  const keys=ORDER.slice(E.pg*PER,(E.pg+1)*PER),done=ORDER.filter(k=>E.ans[k]!=null).length;
  box.innerHTML=`<div class="stack"><span class="eyebrow">Σελίδα ${E.pg+1} από ${pages}</span><div class="progress"><i style="width:${done/ORDER.length*100}%"></i></div>
  ${E.pg===0?`<div class="panel small">${isA?'Για κάθε πρόταση, πατήστε πόσο συχνά σας συμβαίνει <b>τον τελευταίο μήνα</b>.':'Για κάθε πρόταση, πατήστε πόσο συχνά το έχετε παρατηρήσει <b>τον τελευταίο μήνα</b>.'}</div>`:''}
  <div class="items">${keys.map(k=>`<fieldset class="item ${E.miss&&E.ans[k]==null?'miss':''}" id="it_${k}"><legend class="q">${esc(ITEMS[k][isA?'a':'p'])}</legend><div class="opts">${OPTS.map(([v,l])=>`<button type="button" class="opt" data-k="${k}" data-v="${v}" aria-pressed="${E.ans[k]===v}">${l}</button>`).join('')}</div></fieldset>`).join('')}</div>
  ${E.err?`<div class="errbox">${esc(E.err)}</div>`:''}
  <div class="pager"><button class="btn" id="back">Πίσω</button><button class="btn primary" id="go">${E.pg<pages-1?'Επόμενη σελίδα':'Αποστολή απαντήσεων'}</button></div></div>`;
  box.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{E.ans[b.dataset.k]=+b.dataset.v;b.parentElement.querySelectorAll('.opt').forEach(x=>x.setAttribute('aria-pressed',String(x===b)));document.getElementById('it_'+b.dataset.k).classList.remove('miss');save()});
  document.getElementById('back').onclick=()=>{E.err='';E.miss=false;if(E.pg>0)E.pg--;else E.view=isA?'intro':'meta';save();render()};
  document.getElementById('go').onclick=()=>{const miss=keys.filter(k=>E.ans[k]==null);
    if(miss.length){E.miss=true;E.err=`Απαντήστε σε όλες τις ερωτήσεις (λείπουν ${miss.length}).`;render();document.getElementById('it_'+miss[0]).scrollIntoView({block:'center'});return}
    E.miss=false;E.err='';if(E.pg<pages-1){E.pg++;save();return render()}send()};
}
function send(){
  E.view='sending';render();
  const body={type:'eelk',code:E.code,form:F,answers:E.ans,startedAt:E.startedAt};if(!isA)body.informant={relation:E.inf.relation,sex:E.inf.sex,hours:E.inf.hours===''?null:+E.inf.hours};
  fetch(window.__EXEC,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(body)}).then(r=>r.json())
   .then(j=>{if(!(j&&j.ok))throw new Error((j&&j.error)||'σφάλμα διακομιστή');E.done=true;save();E.view='thanks';render()})
   .catch(x=>{E.view='q';E.err='Η αποστολή δεν έγινε ('+(x&&x.message&&!/fetch|Failed/i.test(x.message)?x.message:'σφάλμα σύνδεσης')+'). Οι απαντήσεις σας κρατήθηκαν· ελέγξτε τη σύνδεση και πατήστε ξανά «Αποστολή απαντήσεων».';render()});
}
function vThanks(){box.innerHTML='<div class="stack"><div class="okbox">Οι απαντήσεις σας στάλθηκαν στο ιατρείο.</div><h1>Ευχαριστούμε πολύ!</h1><p>Μπορείτε να κλείσετε αυτή τη σελίδα.</p></div>'}
render();
</script>
<script>
/* Η εμφάνιση και η διεύθυνση της βάσης φορτώνονται από το index.html (κοινά με τις φόρμες της ΣΑΔΕ). */
(async function(){
  const box=document.getElementById('app');
  try{
    const html=await (await fetch('./index.html',{cache:'no-cache'})).text();
    const doc=new DOMParser().parseFromString(html,'text/html');
    doc.querySelectorAll('link[rel=stylesheet],style').forEach(n=>document.head.appendChild(n.cloneNode(true)));
    const m=html.match(/const EXEC = '([^']+)'/);if(!m)throw new Error('exec');
    window.__EXEC=m[1];
    const s=document.createElement('script');
    s.textContent=document.getElementById('bank').textContent+'\n'+document.getElementById('fcode').textContent;
    document.body.appendChild(s);
  }catch(e){box.innerHTML='<p>Η σελίδα δεν φορτώθηκε. Ελέγξτε τη σύνδεση στο διαδίκτυο και ανανεώστε τη σελίδα.</p>'}
})();
</script>
</body>
</html>
