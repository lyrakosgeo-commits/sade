<!DOCTYPE html>
<html lang="el">
<head>
<meta charset="utf-8">
<title>Ερωτηματολόγια αξιολόγησης</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<style>body{font-family:system-ui,sans-serif;background:#F3F5F7;color:#17212B;margin:0;padding:24px 16px}</style>
</head>
<body>
<main class="wrap" id="app"><p>Φόρτωση…</p></main>
<script type="text/plain" id="pcode">
/* ================= ΣΑΔΕ – φόρμα εξεταζόμενου (σύνδεσμος) ================= */
const pesc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pnorm=s=>String(s||'').toUpperCase().replace(/[^A-Z0-9]/g,'');
const pstore={get(k){try{return JSON.parse(localStorage.getItem(k))}catch{return null}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch{}},del(k){try{localStorage.removeItem(k)}catch{}}};
const EXEC_URL=window.__EXEC;
const box=document.getElementById('app');
const qs=new URLSearchParams(location.search);
const P={view:'intro',code:pnorm(qs.get('code')||qs.get('c')||''),R:{},mi:0,pg:0,err:'',miss:false,sent:{},startedAt:new Date().toISOString(),finished:false};
const dkey=()=>'sade_pat_'+P.code;
function restoreDraft(){const d=P.code&&pstore.get(dkey());if(d){P.R=d.R||{};P.mi=d.mi||0;P.pg=d.pg||0;P.sent=d.sent||{};P.startedAt=d.startedAt||P.startedAt;P.finished=!!d.finished}}
restoreDraft();
function saveDraft(){if(P.code)pstore.set(dkey(),{R:P.R,mi:P.mi,pg:P.pg,sent:P.sent,startedAt:P.startedAt,finished:P.finished})}
function pages(m){const out=[],mod=MODS[m];mod.sec.forEach((sec,si)=>{for(let i=0;i<sec.items.length;i+=6)out.push({t:sec.t,sc:sec.sc,intro:si===0&&i===0?mod.intro:'',items:sec.items.slice(i,i+6)})});return out}
const FLOW=PATIENT_FLOW.slice();
const allItems=()=>FLOW.flatMap(m=>MODS[m].sec.flatMap(s=>s.items.map(([k])=>[m,k])));
const complete=m=>MODS[m].sec.every(s=>s.items.every(([k])=>(P.R[m]||{})[k]!=null));
function render(){window.scrollTo({top:0});({intro:vIntro,q:vQ,sending:vSending,thanks:vThanks})[P.view]()}

function vIntro(){
  const resume=Object.keys(P.R).length>0&&!P.finished;
  box.innerHTML=`<div class="stack">
  <h1>Ερωτηματολόγια αξιολόγησης</h1>
  <p>Οι ερωτήσεις αφορούν το πώς είστε σήμερα και πώς ήσασταν ως παιδί. Δεν υπάρχουν σωστές ή λάθος απαντήσεις· απαντήστε με βάση αυτό που ισχύει συνήθως για εσάς. Η συμπλήρωση διαρκεί περίπου <b>20 λεπτά</b>.</p>
  <div class="panel small stack"><p>Δεν ζητάμε το όνομά σας. Οι απαντήσεις συνδέονται μόνο με τον κωδικό που σας έδωσε ο θεραπευτής και φτάνουν μόνο στο ιατρείο. Μπορείτε να κάνετε διάλειμμα: οι απαντήσεις φυλάγονται σε αυτή τη συσκευή και συνεχίζετε ανοίγοντας ξανά τον ίδιο σύνδεσμο.</p></div>
  <label class="f" for="p_code">Κωδικός<input id="p_code" type="text" class="code" maxlength="8" autocapitalize="characters" autocomplete="off" value="${pesc(P.code)}"></label>
  <label class="checks" style="display:flex" for="p_ok"><input type="checkbox" id="p_ok"> <span>Συμφωνώ να συμπληρώσω τα ερωτηματολόγια και να σταλούν οι απαντήσεις μου στο ιατρείο.</span></label>
  ${P.err?`<div class="errbox">${pesc(P.err)}</div>`:''}
  <div><button class="btn primary" id="go">${resume?'Συνέχεια από εκεί που σταματήσατε':'Έναρξη'}</button></div></div>`;
  document.getElementById('go').onclick=()=>{const c=pnorm(document.getElementById('p_code').value);
    if(c.length<6){P.err='Γράψτε τον κωδικό των 6 χαρακτήρων που σας έστειλε ο θεραπευτής.';return render()}
    if(!document.getElementById('p_ok').checked){P.err='Για να συνεχίσετε, τσεκάρετε ότι συμφωνείτε.';return render()}
    if(c!==P.code){P.code=c;P.R={};P.mi=0;P.pg=0;P.sent={};P.finished=false;restoreDraft()}
    P.err='';if(P.finished){P.view='thanks';return render()}
    const first=FLOW.findIndex(m=>!complete(m));if(first<0){finish();return}
    if(P.mi>first||P.mi>=FLOW.length){P.mi=first;P.pg=0}
    P.view='q';saveDraft();render()};
}
function vQ(){
  const m=FLOW[P.mi],mod=MODS[m],pg=pages(m),p=pg[P.pg];P.R[m]=P.R[m]||{};const a=P.R[m],opts=SCALES[p.sc];
  const ai=allItems(),done=ai.filter(([mm,k])=>(P.R[mm]||{})[k]!=null).length;
  const cols=opts.length===2?' style="grid-template-columns:repeat(2,1fr)"':'';
  box.innerHTML=`<div class="stack"><span class="eyebrow">Ενότητα ${P.mi+1} από ${FLOW.length} · ${pesc(mod.title)}</span>
  <div class="progress"><i style="width:${done/ai.length*100}%"></i></div>
  <h2>${pesc(p.t)}</h2>${p.intro?`<div class="panel small">${p.intro}</div>`:''}
  <div class="items">${p.items.map(([k,t])=>`<fieldset class="item ${P.miss&&a[k]==null?'miss':''}" id="it_${k}"><legend class="q">${pesc(t)}</legend><div class="opts ${opts.length===3?'o3':''}"${cols}>${opts.map(([l,v])=>`<button type="button" class="opt" data-k="${k}" data-v="${v}" aria-pressed="${a[k]===v}">${pesc(l)}</button>`).join('')}</div></fieldset>`).join('')}</div>
  ${P.err?`<div class="errbox">${pesc(P.err)}</div>`:''}
  <div class="pager"><button class="btn" id="back">Πίσω</button><button class="btn primary" id="go">${P.pg<pg.length-1?'Επόμενη σελίδα':P.mi<FLOW.length-1?'Επόμενη ενότητα':'Αποστολή απαντήσεων'}</button></div></div>`;
  box.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{a[b.dataset.k]=+b.dataset.v;b.parentElement.querySelectorAll('.opt').forEach(x=>x.setAttribute('aria-pressed',String(x===b)));document.getElementById('it_'+b.dataset.k).classList.remove('miss');saveDraft()});
  document.getElementById('back').onclick=()=>{P.err='';P.miss=false;if(P.pg>0)P.pg--;else if(P.mi>0){P.mi--;P.pg=pages(FLOW[P.mi]).length-1}else P.view='intro';saveDraft();render()};
  document.getElementById('go').onclick=()=>{const miss=p.items.filter(([k])=>a[k]==null);
    if(miss.length){P.miss=true;P.err=`Απαντήστε σε όλες τις ερωτήσεις (λείπουν ${miss.length}).`;render();document.getElementById('it_'+miss[0][0]).scrollIntoView({block:'center'});return}
    P.miss=false;P.err='';
    if(P.pg<pg.length-1){P.pg++;saveDraft();return render()}
    P.sent[m]=0;
    if(P.mi<FLOW.length-1){P.mi++;P.pg=0;saveDraft();send(false);return render()}
    finish()};
}
function payload(final){const R={};FLOW.forEach(m=>{if(P.R[m]&&Object.keys(P.R[m]).length)R[m]=P.R[m]});return {type:'patient',code:P.code,R,startedAt:P.startedAt,final:!!final}}
function post(body){return fetch(EXEC_URL,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(body)}).then(r=>r.json())}
function send(final){return post(payload(final)).then(j=>{if(j&&j.ok){FLOW.forEach(m=>{if(complete(m))P.sent[m]=1});saveDraft();return true}return false}).catch(()=>false)} // ενδιάμεση αποστολή μετά από κάθε ενότητα
function finish(){
  P.view='sending';render();
  post(payload(true)).then(j=>{if(!(j&&j.ok))throw new Error((j&&j.error)||'σφάλμα διακομιστή');P.finished=true;saveDraft();P.view='thanks';render()})
   .catch(x=>{P.view='q';P.mi=FLOW.length-1;P.pg=pages(FLOW[P.mi]).length-1;P.err='Η αποστολή δεν έγινε ('+(x&&x.message&&!/fetch|Failed/i.test(x.message)?x.message:'σφάλμα σύνδεσης')+'). Οι απαντήσεις σας κρατήθηκαν· ελέγξτε τη σύνδεση στο διαδίκτυο και πατήστε ξανά «Αποστολή απαντήσεων».';render()});
}
function vSending(){box.innerHTML='<div class="stack"><h1>Αποστολή…</h1><p class="muted">Μην κλείσετε τη σελίδα.</p></div>'}
function vThanks(){
  const d=P.R.DIFF||{};const risk=d.D4>=1&&d.D4<=3;
  box.innerHTML=`<div class="stack"><div class="okbox">Οι απαντήσεις σας στάλθηκαν στο ιατρείο.</div><h1>Ευχαριστούμε πολύ!</h1>
  ${risk?`<div class="warnbox stack"><p><b>Αναφέρατε σκέψεις ότι θα ήταν καλύτερα να μη ζείτε ή να βλάψετε τον εαυτό σας.</b> Ο θεραπευτής σας θα δει τις απαντήσεις σας, όχι όμως αμέσως.</p><p>Αν τώρα νιώθετε ότι κινδυνεύετε, μη μείνετε μόνος/η: καλέστε τη <b>Γραμμή Παρέμβασης για την Αυτοκτονία 1018</b> (όλο το 24ωρο), το <b>166</b> ή το <b>112</b>, ή πηγαίνετε στα επείγοντα του πλησιέστερου νοσοκομείου. Μπορείτε επίσης να καλέσετε το ιατρείο που σας παρακολουθεί.</p></div>`:''}
  <p>Μπορείτε να κλείσετε αυτή τη σελίδα.</p></div>`;
}
render();
</script>
<script>
/* Η τράπεζα ερωτήσεων και η εμφάνιση φορτώνονται από το index.html (κοινά με τη φόρμα γονέα). */
(async function(){
  const box=document.getElementById('app');
  try{
    const html=await (await fetch('./index.html',{cache:'no-cache'})).text();
    const doc=new DOMParser().parseFromString(html,'text/html');
    doc.querySelectorAll('link[rel=stylesheet],style').forEach(n=>document.head.appendChild(n.cloneNode(true)));
    const js=[...doc.querySelectorAll('script')].map(s=>s.textContent).find(t=>t.includes('ΣΑΔΕ – περιεχόμενο'))||'';
    const a=js.indexOf('/* ================= ΣΑΔΕ – περιεχόμενο'),b=js.indexOf('/* ================= ΣΑΔΕ – φόρμα γονέα');
    const m=js.match(/const EXEC = '([^']+)'/);
    if(a<0||b<0||!m)throw new Error('content');
    window.__EXEC=m[1];
    const s=document.createElement('script');
    s.textContent=js.slice(a,b)+'\n'+document.getElementById('pcode').textContent;
    document.body.appendChild(s);
  }catch(e){box.innerHTML='<p>Η σελίδα δεν φορτώθηκε. Ελέγξτε τη σύνδεση στο διαδίκτυο και ανανεώστε τη σελίδα.</p>'}
})();
</script>
</body>
</html>
